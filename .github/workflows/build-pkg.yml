name: Build Trophy Unlocker 13.52 PKG V11.3 Probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V11.3 Triangle probe
        shell: bash
        run: |
          chmod +x ci/build_v11_3_probe.sh
          ./ci/build_v11_3_probe.sh
      - name: Upload V11.3 probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V11-3-PROBE
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v11_3/Trophy_Unlocker_13.52_V11_3_PROBE.pkg
            dist_v11_3/SHA256SUMS.txt
