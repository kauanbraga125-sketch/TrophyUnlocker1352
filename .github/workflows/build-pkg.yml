name: Build Trophy Unlocker 13.52 PKG V10 Visual

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V10 visual smoke
        shell: bash
        run: |
          chmod +x ci/build_v10_visual.sh
          ./ci/build_v10_visual.sh
      - name: Upload V10 visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V10-VISUAL
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v10/Trophy_Unlocker_13.52_V10_VISUAL.pkg
            dist_v10/SHA256SUMS.txt
