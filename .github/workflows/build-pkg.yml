name: Build Trophy Unlocker 13.52 PKG V8 Discovery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V8 installed-game discovery test
        shell: bash
        run: |
          chmod +x ci/build_v8_discovery.sh
          ./ci/build_v8_discovery.sh
      - name: Upload V8 discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V8-DISCOVERY
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v8/Trophy_Unlocker_13.52_V8_DISCOVERY.pkg
            dist_v8/SHA256SUMS.txt
