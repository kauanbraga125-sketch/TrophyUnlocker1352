name: Build Trophy Unlocker 13.52 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OO_VERSION: v0.5.4
      OO_ASSET: toolchain-llvm-18.tar.gz
      DEPS: ${{ github.workspace }}/.deps
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct project sources
        shell: bash
        run: |
          set -euxo pipefail
          cat source_parts/source.part.* | base64 -d > /tmp/tu1352_source.zip
          unzip -t /tmp/tu1352_source.zip
          unzip -o /tmp/tu1352_source.zip -d "$GITHUB_WORKSPACE"
          chmod +x scripts/*.sh || true
          find . -maxdepth 3 -type f | sort

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 make git curl tar xz-utils unzip python3 file
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-18 /usr/local/bin/llvm-ranlib
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy
          clang --version
          ld.lld --version
          llvm-ar --version
          docker --version

      - name: Run host safety tests
        run: make -C host_test clean run

      - name: Download OpenOrbis v0.5.4
        run: |
          set -euxo pipefail
          mkdir -p "$DEPS"
          cd "$DEPS"
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_VERSION}/${OO_ASSET}" \
            -o "$OO_ASSET"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $OO_ASSET" | sha256sum -c -
          tar xzf "$OO_ASSET"
          TOOLCHAIN_DIR="$(find "$DEPS" -type f -name link.x -printf '%h\n' | head -n1)"
          test -n "$TOOLCHAIN_DIR"
          test -f "$TOOLCHAIN_DIR/link.x"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          chmod +x "$TOOLCHAIN_DIR/bin/linux/"* || true

      - name: Use stock OpenOrbis PkgTool.Core under .NET Core 3.1
        run: |
          set -euxo pipefail
          TOOL="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          test -s "$TOOL"
          mv "$TOOL" "$TOOL.real"
          docker pull mcr.microsoft.com/dotnet/core/runtime:3.1-bionic
          cat > "$TOOL" <<EOF
          #!/usr/bin/env bash
          set -e
          exec docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e DOTNET_ROLL_FORWARD=Minor \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            -v /home/runner/work:/home/runner/work \
            -w "\$PWD" \
            mcr.microsoft.com/dotnet/core/runtime:3.1-bionic \
            "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core.real" "\$@"
          EOF
          chmod +x "$TOOL"
          "$TOOL" version || "$TOOL" --help || true

      - name: Fetch GoldHEN SDK and plugin repository
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$DEPS/GoldHEN_Plugins_SDK"
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$DEPS/GoldHEN_Plugins_Repository"
          echo "GOLDHEN_SDK=$DEPS/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"

      - name: Build GoldHEN hook SDK
        run: |
          set -euxo pipefail
          make -C "$GOLDHEN_SDK" PRINTF=1
          test -f "$GOLDHEN_SDK/libGoldHEN_Hook.a"
          test -f "$GOLDHEN_SDK/build/crtprx.o"

      - name: Build Trophy Unlocker PRX
        run: |
          set -euxo pipefail
          ./scripts/install_into_goldhen_repo.sh "$DEPS/GoldHEN_Plugins_Repository"
          GH_REPO="$DEPS/GoldHEN_Plugins_Repository"
          COMMIT="$(git -C "$GH_REPO" rev-parse HEAD)"
          BRANCH="$(git -C "$GH_REPO" branch --show-current)"
          NUM="$(git -C "$GH_REPO" rev-list HEAD --count)"
          {
            echo '#pragma once'
            echo "#define GIT_COMMIT \"$COMMIT\""
            echo "#define GIT_VER \"$BRANCH\""
            echo "#define GIT_NUM $NUM"
            echo "#define BUILD_DATE \"$(date '+%b %d %Y @ %T')\""
          } > "$GH_REPO/common/git_ver.h"
          make -C "$GH_REPO/plugin_src/trophy_unlocker_1352" clean
          make -C "$GH_REPO/plugin_src/trophy_unlocker_1352"
          PRX="$GH_REPO/bin/plugins/prx_final/trophy_unlocker_1352.prx"
          test -s "$PRX"
          cp "$PRX" installer/trophy_unlocker_1352.prx
          mkdir -p dist
          cp "$PRX" dist/trophy_unlocker_1352.prx

      - name: Build installable manager PKG
        run: |
          set -euxo pipefail
          make -C installer clean
          make -C installer
          PKG="installer/IV0000-BREW13520_00-TROPHYUNLOCK1352.pkg"
          test -s "$PKG"
          cp "$PKG" dist/Trophy_Unlocker_13.52_Manager.pkg
          sha256sum dist/Trophy_Unlocker_13.52_Manager.pkg dist/trophy_unlocker_1352.prx > dist/SHA256SUMS.txt
          file dist/*
          ls -lh dist

      - name: Upload PS4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-PS4-stock-pkgtool
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Trophy_Unlocker_13.52_Manager.pkg
            dist/trophy_unlocker_1352.prx
            dist/SHA256SUMS.txt
