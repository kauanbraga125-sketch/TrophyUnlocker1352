name: Build Trophy Unlocker 13.52 PKG V12 UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V12 organized UI
        shell: bash
        run: |
          chmod +x ci/build_v12.sh
          ./ci/build_v12.sh
      - name: Upload V12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V12-UI
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v12/Trophy_Unlocker_13.52_V12_UI.pkg
            dist_v12/SHA256SUMS.txt
