name: Build Trophy Unlocker 13.52 PKG V11.2 Probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V11.2 safe probe
        shell: bash
        run: |
          chmod +x ci/build_v11_library.sh
          ./ci/build_v11_library.sh
      - name: Upload V11.2 probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V11-2-PROBE
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v11_2/Trophy_Unlocker_13.52_V11_2_PROBE.pkg
            dist_v11_2/SHA256SUMS.txt
