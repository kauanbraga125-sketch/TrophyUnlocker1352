name: Build Trophy Unlocker 13.52 PKG V7 Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V7 official OpenOrbis smoke test
        shell: bash
        run: |
          chmod +x ci/build_v7_smoke.sh
          ./ci/build_v7_smoke.sh
      - name: Upload V7 smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V7-SMOKE
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v7/Trophy_Unlocker_13.52_V7_SMOKE.pkg
            dist_v7/SHA256SUMS.txt
