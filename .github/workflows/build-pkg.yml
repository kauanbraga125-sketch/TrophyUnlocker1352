name: Build Trophy Unlocker 13.52 PKG V9 Errno

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build V9 errno discovery diagnostic
        shell: bash
        run: |
          chmod +x ci/build_v9_errno.sh
          ./ci/build_v9_errno.sh
      - name: Upload V9 errno artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V9-ERRNO
          if-no-files-found: error
          retention-days: 7
          path: |
            dist_v9/Trophy_Unlocker_13.52_V9_ERRNO.pkg
            dist_v9/SHA256SUMS.txt
