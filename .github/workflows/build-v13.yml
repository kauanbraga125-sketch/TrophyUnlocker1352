name: Build Trophy Unlocker V13.21 L2 Fake Unlock

on:
  push:
    branches: [feature/v13.21-l2-fake-unlock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test and build V13.21 L2 fake unlock package
        run: bash ci/build_v13.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TrophyUnlocker1352-V13.21-L2-Fake-Unlock
          if-no-files-found: error
          retention-days: 30
          path: |
            dist_v13/Trophy_Unlocker_13.52_V13_21_L2_Fake_Unlock.pkg
            dist_v13/SHA256SUMS.txt
            dist_v13/host-tests.txt
            dist_v13/pkg-validation.txt
            dist_v13/param-sfo.txt
      - name: Publish validated V13.21 L2 fake unlock PKG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.21-l2-fake-unlock
          name: Trophy Unlocker V13.21 L2 Fake Unlock
          prerelease: true
          files: |
            dist_v13/Trophy_Unlocker_13.52_V13_21_L2_Fake_Unlock.pkg
            dist_v13/SHA256SUMS.txt
            dist_v13/pkg-validation.txt
            dist_v13/host-tests.txt
